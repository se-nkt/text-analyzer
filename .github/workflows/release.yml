name: Auto Release on Tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release artifact
        run: |
          mkdir -p dist
          tar -czvf dist/text-analyzer-${{ github.ref_name }}.tar.gz analyzer.py test_analyzer.py requirements.txt Dockerfile

      - name: Create GitHub Release with Changelog and Artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/text-analyzer-${{ github.ref_name }}.tar.gz
