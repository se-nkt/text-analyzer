name: CI Pipeline with Security & Code Quality Analysis

on: [push]

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and security tools
        run: |
          pip install -r requirements.txt
          pip install bandit flake8 pip-audit

      - name: Code Quality Check (Linting)
        run: flake8 analyzer.py test_analyzer.py --max-line-length=100

      - name: Security SAST Scan (Bandit)
        run: bandit -r analyzer.py -ll

      - name: Dependency Vulnerability Audit (pip-audit)
        run: pip-audit

      - name: Run Unit Tests
        run: pytest -v
