name: Build and Webhook Notification

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -v

      - name: Send Pipeline Notification (Webhook)
        if: always()
        run: |
          echo "Отправка уведомления о статусе пайплайна: ${{ job.status }}..."
          curl -s -X POST "https://httpbin.org" \
            -H "Content-Type: application/json" \
            -d "{\"recipient\": \"developer@example.com\", \"repository\": \"${{ github.repository }}\", \"branch\": \"${{ github.ref_name }}\", \"status\": \"${{ job.status }}\"}"
          echo "Уведомление успешно доставлено!"
